name: Release on Tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 读取版本与上一标签
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 找当前标签之外最近的一个标签作为上一个版本
          PREV=$(git tag --sort=-creatordate | grep -v "^$TAG$" | head -n 1 || true)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prev=${PREV:-v0.0.0}" >> "$GITHUB_OUTPUT"

      - name: 提取提交记录
        run: |
          if [ "${{ steps.version.outputs.prev }}" = "v0.0.0" ]; then
            git log --format=%s > commits.txt
          else
            git log "${{ steps.version.outputs.prev }}..${{ steps.version.outputs.tag }}" --format=%s > commits.txt
          fi

      - name: 生成更新说明
        run: |
          python3 << 'EOF'
          import re
          with open("commits.txt", encoding="utf-8") as f:
              commits = [line.strip() for line in f if line.strip()]

          sections = {"feat": [], "fix": [], "docs": [], "other": []}
          for c in commits:
              m = re.match(r"^(feat|fix|docs)(\(.*?\))?:?\s*(.*)", c)
              if m:
                  sections[m.group(1)].append(f"- {m.group(3) or c}")
              else:
                  sections["other"].append(f"- {c}")

          lines = [f"## 更新说明（共 {len(commits)} 条提交）", ""]

          def add(title, items):
              if items:
                  lines.append(f"### {title}")
                  lines.extend(items)
                  lines.append("")

          add("新增", sections["feat"])
          add("修复", sections["fix"])
          add("更新", sections["docs"])
          add("其他", sections["other"])
          lines.append("---")
          lines.append("> 本更新说明由自动工作流根据提交记录生成")
          with open("release_body.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines))
          EOF

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 授予 Gradle 执行权限
        run: chmod +x gradlew

      - name: 构建模组
        run: ./gradlew build --no-daemon

      - name: 重命名构建产物
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -n 1)
          mv "$JAR" "bosschongsheng-${{ steps.version.outputs.tag }}.jar"

      - name: 创建正式 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "bosschongsheng-${{ steps.version.outputs.tag }}.jar" \
            --title "Boss重生 ${{ steps.version.outputs.tag }}" \
            --notes-file release_body.md
